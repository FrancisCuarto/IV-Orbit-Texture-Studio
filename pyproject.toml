[project]
name = "iv-orbit-texture-studio"
version = "0.1.0"
description = "Suite de escritorio para extraer, transformar y preparar texturas y sprites para videojuegos."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2.4.6",
    "pillow>=13.0.0",
    "pyside6-essentials>=6.12.0",
]

[project.scripts]
iv-orbit-texture-studio = "iv_orbit_texture_studio.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iv_orbit_texture_studio"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-qt>=4.5.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = ["N802"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = false
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true


